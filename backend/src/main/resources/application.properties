spring.datasource.url=jdbc:mysql://localhost:3306/${DB_IPB_BANCO}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_IPB_USUARIO}
spring.datasource.password=${DB_IPB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_general_ci
